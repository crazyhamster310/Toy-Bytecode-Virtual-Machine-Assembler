name: CI

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]

jobs:
  quality-check:
    name: Quality Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy clang-format cmake

      - name: Bootstrap Python environment
        run: make setup-asm

      - name: Run all checks
        run: make check

  build-release-binaries:
    name: Build Release on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: byte-vm-linux-x86_64
          - os: macos-latest
            artifact_name: byte-vm-macos-arm64
          - os: windows-latest
            artifact_name: byte-vm-windows-x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake (Release mode)
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -DENABLE_SANITIZERS=OFF
          -DBUILD_TESTING=OFF

      - name: Build byte-vm and byte-disasm
        run: cmake --build build --config Release --target byte-vm byte-disasm

      - name: Install binaries into staging directory
        run: cmake --install build --config Release --prefix dist-bin

      - name: Upload platform artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist-bin/bin/

  publish-release:
    name: Publish Multi-Platform Release
    needs: [ quality-check, build-release-binaries ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build Python packages
        run: |
          make setup-asm
          make build-asm-dist

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts

      - name: Package release archives
        run: |
          mkdir -p release-assets
          
          # Linux tar.gz
          tar -czvf release-assets/byte-vm-linux-x86_64.tar.gz -C downloaded-artifacts/byte-vm-linux-x86_64 .
          
          # macOS ARM64 tar.gz
          tar -czvf release-assets/byte-vm-macos-arm64.tar.gz -C downloaded-artifacts/byte-vm-macos-arm64 .
          
          # Windows zip
          cd downloaded-artifacts/byte-vm-windows-x64 && zip -r ../../release-assets/byte-vm-windows-x64.zip . && cd ../..
          
          cp assembler/dist/* release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true